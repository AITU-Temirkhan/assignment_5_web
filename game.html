<main>
<h1>Higher or Lower: Game Prices</h1>
<p>Is the price of the next game higher or lower? Equal price counts as a right guess.</p>
<div class="stats box"><span>Lives: <b id="lives"></b></span><span>Streak: <b id="streak"></b></span><span>Best: <b id="best"></b></span></div>
<div class="duel">
<div class="box"><p class="muted">Current game</p><h2 id="cur-name"></h2><p class="big" id="cur-price"></p></div>
<div class="box"><p class="muted">Next game</p><h2 id="next-name"></h2><p class="big">$?</p></div>
</div>
<div class="actions"><button data-choice="higher">Higher ▲</button><button data-choice="lower">Lower ▼</button><button id="restart">Restart</button></div>
<p id="msg" class="msg" role="status"></p>
